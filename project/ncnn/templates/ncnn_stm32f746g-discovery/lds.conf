/* STM32F746NG: 1 MiB internal flash and 320 KiB addressable SRAM. */
ROM (0x08000000, 1M)
RAM (0x20000000, 320K)

/* The board also has 8 MiB SDRAM at 0x60000000 and 16 MiB QSPI at
 * 0x90000000. Stage 1 uses SDRAM as a fixed heap; QSPI linker sections are
 * introduced together with NCNN in a later stage. */
region (QSPI, 0x90000000, 16M)

text   (ROM)
rodata (ROM)
data   (RAM, ROM)
bss    (RAM)
