/* STM32F746NG: 1 MiB internal flash and 320 KiB addressable SRAM. */
ROM (0x08000000, 1M)
RAM (0x20000000, 320K)

/* The board also has 8 MiB SDRAM at 0x60000000 and 16 MiB QSPI at
 * 0x90000000. SDRAM starts with a reserved 256 KiB LCD region; the remaining 7.75 MiB
 * is a fixed heap. QSPI models are flashed separately:
 * MobileNet at 0x90500000, convolution at 0x90ff0000. No ELF QSPI sections. */
region (QSPI, 0x90000000, 16M)

text   (ROM)
rodata (ROM)
data   (RAM, ROM)
bss    (RAM)
